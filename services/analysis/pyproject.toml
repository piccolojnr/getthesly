[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "getthesly-analysis"
version = "0.1.0"
description = "Private statistical analysis service foundation for getthesly"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115,<1.0",
  "numpy>=2.1,<3.0",
  "pandas>=2.2,<4.0",
  "pydantic-settings>=2.6,<3.0",
  "scipy>=1.14,<2.0",
  "statsmodels>=0.14.4,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.scripts]
getthesly-analysis = "analysis_api.__main__:main"

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.3,<9.0",
  "pyyaml>=6.0,<7.0",
  "ruff>=0.11,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
